<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האימון שלי</title>
<meta name="description" content="מעקב אימונים אישי למכון הכושר">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אימון">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<script>
  // מחילים ערכת צבעים לפני הציור הראשון, כדי שלא יהיה הבהוב
  try {
    var t = (JSON.parse(localStorage.getItem('gymlog.v1') || '{}').settings || {}).theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<main id="app" aria-live="polite"></main>

<div id="timer" hidden>
  <div class="t-track"><i id="t-fill"></i></div>
  <div class="t-row">
    <div class="t-main">
      <span id="t-label">מנוחה</span>
      <b id="t-time">1:00</b>
    </div>
    <div class="t-btns">
      <button type="button" data-act="timerAdd">+15</button>
      <button type="button" data-act="timerSkip">דלג</button>
    </div>
  </div>
</div>

<nav id="nav" aria-label="ניווט ראשי">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
    <span>בית</span>
  </a>
  <a href="#/log" data-tab="log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15l3.5-4 3 2.5L18 7"/></svg>
    <span>יומן</span>
  </a>
  <a href="#/set" data-tab="set">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 12h2M11 12h8M5 17h7M16 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
    <span>הגדרות</span>
  </a>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="data.js"></script>
<script src="muscles.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
